name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOCKER_IMAGE: lifegoeson34/be-modami-auth-service
  GOFLAGS: -mod=mod

jobs:
  # ─── BUILD & TEST ─────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private GitLab module access
        run: |
          git config --global url."https://${{ secrets.GITLAB_USERNAME }}:${{ secrets.GITLAB_TOKEN }}@gitlab.com/".insteadOf "https://gitlab.com/"
          go env -w GOPRIVATE=gitlab.com/lifegoeson-libs/*
          go env -w GONOSUMDB=gitlab.com/lifegoeson-libs/*
          go env -w GONOPROXY=gitlab.com/lifegoeson-libs/*

      - run: go mod download
      - run: go build -v ./...
      - run: go test -v ./...

  # ─── SECURITY ─────────────────────────────────────────────────────────────
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: table
          output: fs-report.json
          exit-code: '0'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: fs-report.json
          retention-days: 7

  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── RELEASE ──────────────────────────────────────────────────────────────
  docker-build-push:
    runs-on: ubuntu-latest
    needs: [build, trivy-scan, gitleaks-scan]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:v1.0.${{ steps.vars.outputs.short_sha }}
          build-args: |
            BUILDPLATFORM=linux/amd64
            TARGETOS=linux
            TARGETARCH=amd64
          secrets: |
            gitlab_username=${{ secrets.GITLAB_USERNAME }}
            gitlab_token=${{ secrets.GITLAB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
