receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

  memory_limiter:
    check_interval: 1s
    limit_mib: 256


exporters:
  elasticsearch:
    endpoints: ["http://elasticsearch:9200"]
    logs_index: modami-auth-logs
    traces_index: modami-auth-traces

  datadog:
    api:
      site: datadoghq.com
      # Real value injected via the DD_API_KEY env var at container start —
      # never commit it here (OTel Collector's confmap resolver expands this).
      key: ${env:DD_API_KEY}

  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions: [health_check, pprof]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [elasticsearch, datadog, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [elasticsearch, datadog, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [datadog, debug]
